name: Deploy PWA to Cloudflare Worker
# Builds web/ and publishes it to the assets-only Worker `all-in-poker` (wrangler.toml), then verifies the live site with
# real HTTP checks: entry page, every referenced asset, service worker, manifest, SPA fallback. Free plan, private repo.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (token template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
# Optional: with E2E_GROUP_PASSWORD set and the "run_hosted_e2e" input = yes, runs the separate-identity Playwright journeys
# against the live site (only after the owner has entered first, so test players never become the group owner).
on:
  push:
    branches: [main]
    paths: ['web/**', 'engine/src/**', 'wrangler.toml', 'package.json', 'package-lock.json', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
    inputs:
      run_hosted_e2e:
        description: Run the hosted multiplayer journeys after deploying (type yes; the owner must already have entered)
        required: false
        default: 'no'
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-worker
  # A newer approved build supersedes stale live verification; never block deployment for hours.
  cancel-in-progress: true
env:
  SITE: https://all-in-poker.aayush9shah.workers.dev
jobs:
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      creds: ${{ steps.creds.outputs.present }}
      e2e_password: ${{ steps.creds.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Cloudflare credentials and the hosted-e2e password
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"; echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; build only, no deploy"
          else echo "present=true" >> "$GITHUB_OUTPUT"; fi
          if [ -z "${{ secrets.E2E_GROUP_PASSWORD }}" ]; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"; echo "::notice::E2E_GROUP_PASSWORD secret is NOT set — hosted multiplayer journeys will be skipped"
          else echo "e2e=true" >> "$GITHUB_OUTPUT"; echo "::notice::E2E_GROUP_PASSWORD secret detected — hosted multiplayer journeys will run after deploy"; fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck -w web && npm run build -w web
        env: { VITE_BUILD_ID: '${{ github.sha }}' }
      - run: ls -R web/dist && test -f web/dist/index.html && test -f web/dist/sw.js && test -f web/dist/_headers
      - name: Deploy to Cloudflare (wrangler)
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify the live site
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          sleep 10
          html=$(curl -fsS "$SITE/")
          echo "$html" | grep -q '<title>All In</title>' || { echo "::error::entry page missing"; echo "$html" | head -20; exit 1; }
          echo "$html" | grep -q 'id="root"' || { echo "::error::root element missing"; exit 1; }
          for a in $(echo "$html" | grep -o '\(src\|href\)="/[^"]*"' | sed 's/.*="\(.*\)"/\1/' | sort -u); do
            ct=$(curl -fsS -o /dev/null -w '%{content_type}' "$SITE$a") || { echo "::error::asset $a failed"; exit 1; }
            echo "ok $a ($ct)"
          done
          curl -fsS -o /dev/null -w 'sw.js %{http_code} %{content_type}\n' "$SITE/sw.js" | tee /dev/stderr | grep -q 'javascript'
          curl -fsS -o /dev/null -w 'manifest %{http_code} %{content_type}\n' "$SITE/manifest.webmanifest" | tee /dev/stderr | grep -q 'manifest'
          curl -fsS "$SITE/t/anything" | grep -q '<title>All In</title>' && echo "spa fallback ok"
          curl -fsS -o /dev/null -w 'icon %{http_code} %{content_type}\n' "$SITE/icons/icon-192.png" | grep -q 'image/png'
          echo "live site verified: $SITE"
  live-smoke:
    timeout-minutes: 8
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - name: Session, token validation and admission on the live site (WebKit + Chromium, no password)
        run: npm run test:e2e:live -w web
        env: { E2E_BASE: '${{ env.SITE }}' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: live-smoke-results, path: web/test-results, retention-days: 7 }
  hosted-e2e:
    timeout-minutes: 25
    needs: deploy
    # contents: write only here, to publish the run's screenshots/recordings to the e2e-artifacts branch (see last step)
    permissions:
      contents: write
    # Runs when explicitly dispatched (run_hosted_e2e: yes), or automatically after any deploying push once the
    # E2E_GROUP_PASSWORD and Cloudflare secrets are present. A saved password is detected and used — no manual input needed.
    if: >-
      needs.deploy.outputs.creds == 'true' && needs.deploy.outputs.e2e_password == 'true' &&
      (github.event.inputs.run_hosted_e2e == 'yes' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: test -n "${{ secrets.E2E_GROUP_PASSWORD }}" || { echo "::error::E2E_GROUP_PASSWORD secret not set"; exit 1; }
      - run: npm run test:e2e:hosted -w web
        env:
          E2E_BASE: ${{ env.SITE }}
          E2E_GROUP_PASSWORD: ${{ secrets.E2E_GROUP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: hosted-e2e-results, path: web/test-results, retention-days: 7 }
      # Also publish the reviewable files (per-step screenshots, motion recordings, error context — not trace zips) to
      # an orphan `e2e-artifacts` branch, force-updated per run. Actions artifact downloads are blocked from the cloud
      # review environment, but a git branch is reachable, so the recordings can actually be reviewed frame by frame.
      # Uses the job's GITHUB_TOKEN only; no extra secrets. Each run replaces the branch, so history never grows.
      - name: Publish screenshots and recordings to the e2e-artifacts branch
        if: always()
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          if [ -d web/test-results ]; then
            rsync -a --include='*/' --include='*.png' --include='*.webm' --include='*.md' --include='*.txt' --exclude='*' web/test-results/ "$out/"
          fi
          cd "$out"
          printf 'run %s\ncommit %s\nat %s\n' "${{ github.run_id }}" "${{ github.sha }}" "$(date -u +%FT%TZ)" > RUN.txt
          git init -q -b e2e-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Hosted e2e artifacts for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:e2e-artifacts
          echo "published $(find . -type f | wc -l) files to branch e2e-artifacts"
