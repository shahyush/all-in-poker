name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['54329:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run test -w engine
      - run: npm run test -w server
        env:
          ALLIN_DB_URL: postgres://postgres@127.0.0.1:54329/allin_test
          ALLIN_ADMIN_DB_URL: postgres://postgres@127.0.0.1:54329/postgres
      - run: npm run typecheck -w web
