name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run test -w engine
      - run: npm run test -w server
        env:
          ALLIN_DB_URL: postgres://postgres@127.0.0.1:54329/allin_test
          ALLIN_ADMIN_DB_URL: postgres://postgres@127.0.0.1:54329/postgres
      - run: npm run typecheck -w web

  nine-player-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      REVIEW_BROWSER: ${{ matrix.browser }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Initialize isolated development database
        run: ./scripts/local-db-reset.sh allin_dev
      - name: Start local app and server
        run: |
          npm run dev:server > /tmp/allin-server.log 2>&1 &
          VITE_DEV_API=http://127.0.0.1:8787 npm run dev:web > /tmp/allin-web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/dev/now && curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Layout regression matrix
        run: npx playwright test --config web/playwright.layout.config.ts
      - name: Full functional suite including nine independent players
        run: npm run test:e2e -w web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nine-player-review-${{ matrix.browser }}
          path: |
            web/test-results/
            web/layout-results/
            /tmp/allin-server.log
            /tmp/allin-web.log
          retention-days: 7

  firefox-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps firefox
      - run: npx playwright test --config web/playwright.layout.config.ts
        env: { REVIEW_BROWSER: firefox }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-layout-review
          path: web/layout-results/
          retention-days: 7
