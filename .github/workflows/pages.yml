name: Deploy PWA to GitHub Pages
# Manual only. GitHub Pages is free for PUBLIC repositories; on a private repository it needs GitHub Pro (paid), and the
# configure-pages step fails with "Resource not accessible by integration". The supported free host for this private repo
# is Netlify (see netlify.toml). Keep this for the day the repository is public.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://vlnkslhmmbkkvbpvzuiw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6BV7f_xPQjKkayenn8q0Kw_XvcrIxLo' }}
          VITE_BUILD_ID: ${{ github.sha }}
      - run: cp web/dist/index.html web/dist/404.html
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
